<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이미지 입력 검증 — 숫자 정답 검토</title>
<style>body{font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;background:#f2f5fa;color:#172333;margin:0}main{max-width:1050px;margin:auto;padding:20px}header,section{background:white;border:1px solid #dce3ed;padding:20px;border-radius:12px;margin-bottom:14px}header{position:sticky;top:0;z-index:1}h1,h2{margin:0}nav{display:flex;gap:10px;align-items:center}button{padding:9px 14px;border:1px solid #aab8cb;background:white;border-radius:6px}button:disabled{opacity:.4}#export{background:#175cd3;color:white}table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{border-bottom:1px solid #dce3ed;padding:7px}th:first-child{width:45px}td img{width:100%;height:54px;object-fit:contain}td input{width:100%;box-sizing:border-box;font:18px monospace;border:1px solid #aab8cb;border-radius:5px;padding:8px}td input.invalid{background:#fff1d8}label{display:block;padding:12px;background:#eaf2ff;margin-top:12px}.overview{max-width:100%;max-height:340px;object-fit:contain;display:block;margin:auto}section[hidden]{display:none}</style><main><header><h1>이미지 입력 검증: 정답 확인</h1><p>8개 표 · 숫자 192개. 기존 PDF 텍스트는 입력 초안에만 사용했으며 정답이 아닙니다. 셀 이미지와 대조해 수정해주세요.</p><nav><button id="prev">이전</button><span id="progress"></span><button id="next">다음</button><button id="export" disabled>검증 CSV 저장</button></nav></header><!--SECTIONS--></main><script>
const hash='__HASH__',sections=[...document.querySelectorAll('section')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),save=document.querySelector('#export');let current=0;
const inputs=s=>[...s.querySelectorAll('td input')];const valid=s=>inputs(s).every(x=>x.value.trim()&&x.value.trim()!=='UNREADABLE');
function persist(){try{localStorage.setItem('image-truth-'+hash,JSON.stringify(sections.map(s=>({values:inputs(s).map(x=>x.value),verified:s.querySelector('.verified').checked}))))}catch{}}
function update(){sections.forEach((s,i)=>{s.hidden=i!==current;inputs(s).forEach(x=>x.classList.toggle('invalid',!x.value.trim()||x.value.trim()==='UNREADABLE'))});const n=sections.filter(s=>valid(s)&&s.querySelector('.verified').checked).length;document.querySelector('#progress').textContent=`표 ${current+1}/${sections.length} · 완료 ${n}/${sections.length}`;prev.disabled=current===0;next.disabled=current===sections.length-1;save.disabled=n!==sections.length;}
try{let prior=JSON.parse(localStorage.getItem('image-truth-'+hash)||'null');if(prior&&prior.length===sections.length)sections.forEach((s,i)=>{if(prior[i].values.length===inputs(s).length){inputs(s).forEach((x,j)=>x.value=prior[i].values[j]);s.querySelector('.verified').checked=prior[i].verified&&valid(s)}})}catch{}
sections.forEach(s=>{s.querySelector('.verified').onchange=()=>{if(!valid(s))s.querySelector('.verified').checked=false;persist();update()};inputs(s).forEach(x=>x.oninput=()=>{s.querySelector('.verified').checked=false;persist();update()})});prev.onclick=()=>{current--;update()};next.onclick=()=>{current++;update()};save.onclick=()=>{if(sections.some(s=>!valid(s)||!s.querySelector('.verified').checked))return;const rows=[['manifest_sha256','id','human_value','human_status']];sections.forEach(s=>inputs(s).forEach(x=>rows.push([hash,x.dataset.token,x.value.trim(),'VERIFIED'])));const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='image-input-human-verified.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};update();
</script></html>
