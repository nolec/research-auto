<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PDF 표 범위 선택</title>
<style>body{font:16px/1.5 system-ui;background:#f0f4f8;color:#18334a;margin:24px}section{background:white;border-radius:12px;padding:18px;margin:20px 0}canvas{width:100%;height:auto;cursor:crosshair;border:1px solid #ccc}button,select{padding:10px;margin:5px}input{width:95%;padding:8px}label{display:block}strong{color:#a34f11}</style>
<h1>1. PDF 숫자 표 범위 선택</h1><p>숫자 영역의 모든 열 경계(X)와 행 경계(Y)를 지정하세요. 첫 경계와 마지막 경계도 포함합니다. 표 제목·행 이름은 제외하고 숫자만 선택하세요. 병합 셀과 복잡한 표는 별도 검토합니다.</p><p><strong>최대 2페이지 / 100셀. 원본 및 결과는 로컬에만 유지됩니다.</strong></p><main></main><button id="save">범위 JSON 다운로드</button><p id="msg" role="alert"></p>
<script>const payload=__PAYLOAD__;const states=[];const main=document.querySelector('main');
for(const p of payload.pages){const s=document.createElement('section');s.innerHTML=`<h2>PDF ${p.page}페이지</h2><label>선택 모드 <select><option value="xs">열 경계 X</option><option value="ys">행 경계 Y</option></select></label><button class="clear">경계 초기화</button><label>열 경계 (쉼표 구분)<input class="xs"></label><label>행 경계 (쉼표 구분)<input class="ys"></label><canvas width="${p.width}" height="${p.height}"></canvas>`;main.append(s);const canvas=s.querySelector('canvas'),ctx=canvas.getContext('2d'),img=new Image(),fields={xs:s.querySelector('.xs'),ys:s.querySelector('.ys')};const read=k=>fields[k].value.trim()?fields[k].value.split(',').map(v=>v.trim()===''?NaN:Number(v)):[];function draw(){if(!img.complete||!img.naturalWidth)return;ctx.drawImage(img,0,0);ctx.lineWidth=3;for(const k of ['xs','ys']){ctx.strokeStyle=k==='xs'?'#0288d1':'#e36414';for(const v of read(k)){if(!Number.isInteger(v))continue;ctx.beginPath();ctx.moveTo(k==='xs'?v:0,k==='ys'?v:0);ctx.lineTo(k==='xs'?v:p.width,k==='ys'?v:p.height);ctx.stroke()}}}img.onload=draw;img.src=p.image;canvas.onclick=e=>{const rect=canvas.getBoundingClientRect(),k=s.querySelector('select').value,v=Math.round(k==='xs'?(e.clientX-rect.left)*p.width/rect.width:(e.clientY-rect.top)*p.height/rect.height);fields[k].value=[...new Set([...read(k).filter(Number.isInteger),v])].sort((a,b)=>a-b).join(',');draw()};s.querySelector('.clear').onclick=()=>{fields.xs.value=fields.ys.value='';draw()};for(const f of Object.values(fields))f.oninput=draw;states.push({p,read})}
document.querySelector('#save').onclick=()=>{const pages=states.map(({p,read})=>({page:p.page,xs:read('xs'),ys:read('ys')}));let total=0;for(let i=0;i<pages.length;i++){const p=pages[i],src=states[i].p;for(const [k,max] of [['xs',src.width],['ys',src.height]]){const a=p[k];if(a.length<2||a.some((v,j)=>!Number.isInteger(v)||v<0||v>max||(j&&v<=a[j-1]))){document.querySelector('#msg').textContent='경계값을 오름차순으로 2개 이상 지정하세요.';return}}total+=(p.xs.length-1)*(p.ys.length-1)}if(total>100){document.querySelector('#msg').textContent='100셀을 초과했습니다.';return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({manifest:payload.manifest,pages})],{type:'application/json'}));a.download='scope.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.querySelector('#msg').textContent=`${total}셀 범위 다운로드 완료`};</script></html>
