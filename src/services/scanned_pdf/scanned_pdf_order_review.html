<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>숫자 전수 검수</title>
<style>body{font:16px/1.5 system-ui;background:#edf2f6;color:#16304a;margin:24px}article{background:white;padding:18px;border-radius:12px;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:18px}img{max-width:100%;object-fit:contain}article img{max-height:180px}button,input,select{padding:10px;margin:4px;font-size:16px}details img{width:100%}.warn{color:#994800}label{display:block}header{position:sticky;top:0;background:#edf2f6;padding:12px;z-index:1}</style>
<header><h1>2. 모든 숫자 원문 대조</h1><p>OCR은 초안입니다. 각 숫자를 원문과 비교해 확인 또는 판독 불가를 직접 선택하세요. 판독 불가는 빈 값으로만 납품합니다.</p><strong id="progress"></strong><button id="save">검수 JSON 다운로드</button><span id="msg" role="alert"></span></header><main></main>
<script>const payload=__PAYLOAD__;const main=document.querySelector('main'),states=[];for(const [page,image] of Object.entries(payload.pages)){const d=document.createElement('details');const title=document.createElement('summary');title.textContent=`PDF ${page}페이지 전체 원문`;const im=new Image();im.src=image;d.append(title,im);main.append(d)}for(const c of payload.cells){const article=document.createElement('article');const left=document.createElement('div');const h=document.createElement('h3');h.textContent=`PDF ${c.page}페이지 · R${c.row} C${c.column}`;const im=new Image();im.src=c.image;left.append(h,im);const right=document.createElement('div');const label=document.createElement('p');label.textContent=`OCR 초안: ${c.initial||'없음'} (신뢰도 ${c.confidence})`;const value=document.createElement('input');value.value=c.initial;value.placeholder='원문 숫자';const status=document.createElement('select');for(const [v,t] of [['','미검수'],['confirmed','원문 확인 완료'],['unreadable','판독 불가']])status.add(new Option(t,v));const update=()=>{if(status.value==='unreadable'){value.value='';value.disabled=true}else value.disabled=false;document.querySelector('#progress').textContent=`${states.filter(s=>s.status.value).length}/${payload.cells.length} 검수 선택`};status.onchange=update;value.oninput=()=>{status.value='';update()};right.append(label,value,status);article.append(left,right);main.append(article);states.push({c,value,status})}document.querySelector('#progress').textContent=`0/${states.length} 검수 선택`;document.querySelector('#save').onclick=()=>{const responses={};for(const {c,value,status} of states){const v=value.value.trim();if(!status.value||status.value==='confirmed'&&!/^[+-]?(?:[0-9]+|[0-9]{1,3}(?:,[0-9]{3})+)(?:\.[0-9]+)?$/.test(v)){document.querySelector('#msg').textContent=`${c.id}: 확인되지 않았거나 숫자 형식이 잘못됐습니다.`;status.focus();return}responses[c.id]={status:status.value,value:v}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({packet:payload.packet,responses})],{type:'application/json'}));a.download='review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.querySelector('#msg').textContent='검수 기록 저장 완료'};</script></html>
