<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>독립 스캔 PDF 정답 검증</title>
<style>body{margin:0;background:#f3f6fa;font:15px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;color:#172333}main{max-width:1600px;margin:auto;padding:22px}header,section{padding:22px;background:white;border:1px solid #d9e0e8;border-radius:12px;margin-bottom:15px}header{position:sticky;top:0;z-index:3}h1{font-size:24px;margin:0}h2{margin:0;font-size:21px}h3{margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.source{min-width:0}.source img{width:100%;display:block;border:1px solid #d8dce2;margin:6px 0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #dce2eb;text-align:left}th{font-size:12px}td input{width:100%;min-width:70px;padding:7px;border:1px solid #a9b9c9;border-radius:4px;font:inherit;box-sizing:border-box}td:first-child input{min-width:170px}label{display:block;padding:14px;background:#eaf2ff;margin-top:14px}button{padding:9px 14px;border:1px solid #b6c4d4;border-radius:7px;background:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}#export{background:#175cd3;color:#fff;border:none}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}header{position:static}main{padding:10px}}</style></head><body><main>
<header><h1>독립 스캔 PDF 정답 검증</h1><p>10개 표 · __COUNT__개 셀 · 직접 대조 후 체크하고 CSV를 저장해주세요. 결과는 후보 판독기와 분리됩니다.</p><nav><button id="prev">이전</button><span id="progress"></span><button id="next">다음</button><button id="export" disabled>검증 결과 CSV 저장</button></nav></header>
<!--SECTIONS-->
</main><script>
const hash='__MANIFEST_SHA__',sections=[...document.querySelectorAll('section')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),save=document.querySelector('#export');let current=0;
function valid(s){return [...s.querySelectorAll('td input')].every(x=>x.value.trim()&&x.value.trim()!=='UNREADABLE')}
function update(){sections.forEach((s,i)=>s.hidden=i!==current);const n=sections.filter(s=>s.querySelector('.verified').checked&&valid(s)).length;document.querySelector('#progress').textContent=`표 ${current+1}/${sections.length} · 완료 ${n}/${sections.length}`;prev.disabled=current===0;next.disabled=current===sections.length-1;save.disabled=n!==sections.length;}
function persist(){try{localStorage.setItem('holdout-'+hash,JSON.stringify(sections.map(s=>({values:[...s.querySelectorAll('td input')].map(x=>x.value),verified:s.querySelector('.verified').checked}))))}catch{}}
try{const prior=JSON.parse(localStorage.getItem('holdout-'+hash)||'null');if(prior&&prior.length===sections.length)sections.forEach((s,i)=>{const inputs=[...s.querySelectorAll('td input')];if(prior[i].values.length===inputs.length){inputs.forEach((x,j)=>x.value=prior[i].values[j]);s.querySelector('.verified').checked=prior[i].verified&&valid(s)}})}catch{}
sections.forEach(s=>{s.querySelector('.verified').onchange=()=>{if(!valid(s))s.querySelector('.verified').checked=false;persist();update()};s.querySelectorAll('td input').forEach(x=>x.oninput=()=>{s.querySelector('.verified').checked=false;persist();update()})});prev.onclick=()=>{current--;update()};next.onclick=()=>{current++;update()};
save.onclick=()=>{if(sections.some(s=>!s.querySelector('.verified').checked||!valid(s)))return;const rows=[['manifest_sha256','id','page','row_index','column','human_value','human_status']];sections.forEach(s=>s.querySelectorAll('tbody tr').forEach(tr=>tr.querySelectorAll('input').forEach(x=>rows.push([hash,s.dataset.id,s.dataset.page,tr.dataset.row,x.dataset.column,x.value,'VERIFIED']))));const csv=rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='holdout-human-verified.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};update();
</script></body></html>
