<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>경제적 신호 검토</title>
<style>
*{box-sizing:border-box}body{background:#f2f5f9;color:#18212e;font:16px/1.55 system-ui,sans-serif;margin:0}main{max-width:1080px;margin:0 auto;padding:24px}h1{font-size:28px;margin:0}h2{font-size:21px}.card{background:white;border:1px solid #cbd5df;border-radius:12px;margin:14px 0;padding:20px}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}button{font:inherit;color:#142b48;background:#fff;border:1px solid #7c91a5;padding:10px 16px;border-radius:8px;cursor:pointer}button.primary{background:#1d4ed8;color:white;border-color:#1d4ed8}button:hover{outline:2px solid #93b8ff}button:disabled{opacity:.4}#status{font-weight:700;color:#1e3a5f}.excerpt{background:#eef5ff;border-left:4px solid #2463d9;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px}.meta{color:#475569;font-size:14px}a{color:#124ba5}.dim{border-top:1px solid #cbd5df;padding:13px 0;display:grid;grid-template-columns:1fr 320px;gap:10px}.dim strong{display:block;font-size:17px}.dim small{color:#475569}.choices{display:flex;gap:6px;align-items:center}.choices label{flex:1;text-align:center;display:block;border:1px solid #9aabc0;border-radius:7px;padding:10px;cursor:pointer;color:#17212f;background:white}.choices label:has(input:checked){border:2px solid #1d4ed8;background:#dceaff;color:#123d95;font-weight:bold}.choices input{accent-color:#1d4ed8}.evidence{grid-column:1/-1;display:flex;gap:8px;align-items:center}.evidence input{width:100%;min-width:0;padding:8px;border:1px solid #8191a4;border-radius:6px;color:#17212f;background:white}#reason{font:inherit;width:100%;padding:10px;border:1px solid #8191a4;border-radius:7px}#message{color:#a22a1f;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:720px){main{padding:12px}.dim{grid-template-columns:1fr}.evidence{flex-wrap:wrap}.choices{width:100%}}
</style>
<main><h1>경제적 신호 검토 · 신규 34건</h1><p>원문 발췌와 공식 관찰 필드만 보고 각 항목을 독립적으로 판단해 주세요. AI 결과는 표시하지 않습니다.</p>
<div class="card"><strong>판단 기준</strong><br>예 = 직접 근거 있음 · 아니오 = 명시적으로 해당하지 않음 · 모름 = 제공된 자료로 확인 불가.<br>입찰·예산·낙찰·실제 결제는 서로 다른 신호입니다. Steam 구매 배지는 참고 정보일 뿐, 결제 근거로 사용하지 않습니다.</div>
<nav><button id="prev">이전</button><span id="status"></span><button id="next">다음</button><button id="jump">미완료로 이동</button><button id="export" class="primary">검토 JSON 저장</button></nav><div id="message"></div>
<section class="card"><div id="meta" class="meta"></div><h2 id="title"></h2><a id="link" target="_blank" rel="noopener noreferrer">원문 보기</a><div class="excerpt" id="excerpt"></div><pre id="observed"></pre><div id="dims"></div><button id="unknown">미선택 항목을 모두 모름으로 지정</button><p><label for="reason">판단 이유 (예가 있는 경우 필수)</label><textarea id="reason" rows="2" placeholder="확인한 근거와 판단 이유를 적어주세요."></textarea></p></section></main>
<script>
const data=/*__PAYLOAD__*/ null;const $=x=>document.getElementById(x);const records=data.records;const key='fresh-economic-review-'+data.hash;let labels={},index=0;try{const s=JSON.parse(localStorage.getItem(key)||'{}');labels=s.labels||{};index=Number.isInteger(s.index)&&s.index>=0&&s.index<records.length?s.index:0}catch{};
function store(){try{localStorage.setItem(key,JSON.stringify({labels,index}))}catch{}}
function evidenceLines(r){const arr=[r.excerpt];for(const [k,v] of Object.entries(r.evidence_fields||{})){for(const a of v)arr.push(k+'='+a)}return arr}
function complete(r){const a=labels[r.document_id];if(!a)return false;return data.dimensions.every(([field])=>{const x=a.signals?.[field];return x&&['yes','no','unknown'].includes(x.state)&&(x.state!=='yes'||(x.quote&&evidenceLines(r).some(t=>t.includes(x.quote))&&a.reason?.trim()))})}
function save(){const r=records[index],signals={};for(const [f] of data.dimensions){const state=document.querySelector('input[name="'+f+'"]:checked')?.value||'';signals[f]={state,quote:state==='yes'?$('q-'+f).value.trim():null}}labels[r.document_id]={signals,reason:$('reason').value.trim()};store()}
function render(){const r=records[index],a=labels[r.document_id]||{};$('meta').textContent=r.source+' · '+r.published_at;$('title').textContent=r.title;$('link').href=r.source_url;$('excerpt').textContent=r.excerpt;const lines=evidenceLines(r).slice(1);$('observed').textContent=(lines.length?'공식 관찰 필드 (원문 발췌와 별도):\n'+lines.join('\n'):'')+(r.context_only?'\n참고 정보 (긍정 근거로 사용하지 않음): '+JSON.stringify(r.context_only):'');$('reason').value=a.reason||'';$('dims').replaceChildren();for(const [f,title,hint] of data.dimensions){const row=document.createElement('div');row.className='dim';const wording=document.createElement('div');const strong=document.createElement('strong');strong.textContent=title;const small=document.createElement('small');small.textContent=hint;wording.append(strong,small);row.append(wording);const choices=document.createElement('div');choices.className='choices';for(const [value,label] of [['yes','예'],['no','아니오'],['unknown','모름']]){const l=document.createElement('label'),i=document.createElement('input');i.type='radio';i.name=f;i.value=value;i.checked=a.signals?.[f]?.state===value;l.append(i,document.createTextNode(' '+label));choices.append(l);i.onchange=()=>{ev.style.display=i.value==='yes'?'flex':'none';save();update()}}row.append(choices);const ev=document.createElement('div');ev.className='evidence';const q=document.createElement('input');q.id='q-'+f;q.placeholder='예의 직접 근거를 입력 또는 선택';q.value=a.signals?.[f]?.quote||'';q.oninput=()=>{save();update()};const select=document.createElement('select');select.setAttribute('aria-label','근거 선택');select.add(new Option('근거 선택',''));evidenceLines(r).forEach((v,n)=>select.add(new Option(n===0?'발췌문 전체':v,v)));select.onchange=()=>{if(select.value){q.value=select.value;save();update()}};ev.append(select,q);ev.style.display=a.signals?.[f]?.state==='yes'?'flex':'none';row.append(ev);$('dims').append(row)}update()}
function update(){const done=records.filter(complete).length;$('status').textContent=`${index+1}/${records.length} · 완료 ${done}/${records.length}`;$('prev').disabled=index===0;$('next').disabled=index===records.length-1}
function nav(i){save();index=Math.max(0,Math.min(records.length-1,i));store();render()}
$('prev').onclick=()=>nav(index-1);$('next').onclick=()=>nav(index+1);$('jump').onclick=()=>{save();const i=records.findIndex(r=>!complete(r));if(i>=0)nav(i)};$('unknown').onclick=()=>{for(const [f] of data.dimensions){if(!document.querySelector('input[name="'+f+'"]:checked'))document.querySelector('input[name="'+f+'"][value="unknown"]').checked=true}save();update()};$('reason').oninput=()=>{save();update()};$('export').onclick=()=>{save();const done=records.filter(complete).length;const result={snapshot_sha256:data.hash,reviewer:'user',status:done===records.length?'REVIEWER_SUBMISSION_PENDING_VALIDATION':'REVIEWER_SUBMISSION_PARTIAL',completed:done,labels};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='research-auto-economic-review-v2-20261123.json';a.click();URL.revokeObjectURL(url);$('message').textContent=done===records.length?'전체 검토 저장 요청 완료':'부분 검토 저장 요청 완료 — 미완료 항목을 계속 검토할 수 있어요.'};render();
</script></html>
