<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research-Auto · 실행 결과</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#182536;font:15px/1.6 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:36px 24px}h1{font-size:32px;margin:6px 0}h2{font-size:19px;margin:0 0 14px}.eyebrow{font-size:12px;letter-spacing:2px;color:#356c72;font-weight:800}.sub{color:#526476}.notice{background:#eaf2f3;border-left:4px solid #347a80;padding:14px 18px;margin:24px 0;border-radius:6px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:24px 0}.metric,.card{background:white;border:1px solid #dce4eb;border-radius:12px;padding:18px}.metric b{display:block;font-size:27px}.metric span{color:#526476;font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{font:inherit;padding:10px 12px;border:1px solid #becbd6;border-radius:8px;background:white}input{flex:1;min-width:180px}.card{margin-bottom:12px}.title{font-weight:750;font-size:17px}.badge{display:inline-block;background:#fff0d5;color:#805600;border-radius:20px;padding:3px 9px;font-size:12px;margin:8px 8px 8px 0}.quote{white-space:pre-wrap;background:#f3f6f8;padding:14px;border-radius:8px;overflow-wrap:anywhere}a{color:#205e70}details{margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}footer{color:#526476;font-size:13px;margin-top:24px}
</style><main><div class="eyebrow">RESEARCH-AUTO / EXPERIMENT WORKSPACE</div><h1>실제 데이터 탐색</h1><div id="meta" class="sub"></div><div class="notice">기존 <b>rule_v1</b> 엔진의 실제 실행 결과입니다. 키워드 감지는 구매·사업성 증명이 아닙니다. 군집화 및 자동 Opportunity Card 생성은 실행되지 않았습니다.</div><div id="metrics" class="metrics"></div><h2>문서별 분석 결과 <span id="count"></span></h2><div class="controls"><input id="query" placeholder="제목, 문서 ID, 인용 검색" aria-label="검색"><select id="filter" aria-label="결과 필터"><option value="all">전체</option><option value="problem">문제 신호</option><option value="money">금전 키워드</option><option value="abstained">기권</option><option value="error">실패</option></select></div><section id="results"></section><footer>읽기 전용 실행 기록 · 원자료와 기존 제품 정책은 변경하지 않았습니다.</footer></main>
<script>
let result = /*__RESULT__*/ null;
const availableRuns = /*__RUNS__*/ [];
const snapshots = /*__SNAPSHOTS__*/ {};
const offline=Object.keys(snapshots).length>0;
const $ = id => document.getElementById(id);
const el = (tag, text, cls) => {const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node};
function show(){
 if(!result){$('meta').textContent='저장된 실행 데이터와 범위를 선택하세요.';return;}
 const rows=result.rows; $('meta').textContent=`${offline?'저장된 엔진 결과 · ':''}${result.source} · ${result.run_id} · ${result.elapsed_seconds}초 (원 실행)`;
 const counts=[['처리 문서',rows.length],['문제 신호',rows.filter(r=>r.output?.problem_signal).length],['금전 키워드',rows.filter(r=>r.output?.money_signal).length],['기권',rows.filter(r=>r.output?.abstention_reason).length],['실패',rows.filter(r=>r.error).length],['생성 카드',rows.reduce((n,r)=>n+(r.assessment?.cards?.length||0),0)]];
 $('metrics').replaceChildren(...counts.map(([name,n])=>{const box=el('div','','metric');box.append(el('b',n),el('span',name));return box}));
 function filter(){const mode=$('filter').value,q=$('query').value.trim().toLowerCase();const filtered=rows.filter(r=>{const o=r.output;return (mode==='all'||(mode==='problem'&&o?.problem_signal)||(mode==='money'&&o?.money_signal)||(mode==='abstained'&&o?.abstention_reason)||(mode==='error'&&r.error))&&[r.title,r.document_id,o?.evidence_quote].join(' ').toLowerCase().includes(q)});$('count').textContent=`(${filtered.length}/${rows.length})`; $('results').replaceChildren(...filtered.map(r=>{const card=el('article','','card');const o=r.output;card.append(el('div',r.title||r.document_id,'title'),el('div',r.document_id,'sub'));card.append(el('span',r.error?'FAILED':r.assessment?.status||'UNKNOWN','badge'));if(o?.problem_signal)card.append(el('span','문제 신호','badge'));if(o?.money_signal)card.append(el('span',`금전 키워드: ${o.money_signal_type}`,'badge'));card.append(el('div',r.error||o?.evidence_quote||o?.abstention_reason||'출력 없음','quote'));if(r.assessment)card.append(el('p',`판정: ${r.assessment.automatic_decision} · 실행 가능성: ${r.assessment.actionability_status}`));try{const u=new URL(r.source_url);if(['https:','http:'].includes(u.protocol)){const a=el('a','원문 열기');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}}catch{} const details=el('details','');details.append(el('summary','실제 엔진 출력 및 보류 사유'),el('pre',JSON.stringify({extraction:o,assessment:r.assessment,error:r.error},null,2)));card.append(details);return card}));}
 $('query').oninput=filter;$('filter').onchange=filter;filter();
}
if(availableRuns.length){
 const controls=el('div','','controls'), selector=el('select',''), limit=el('select',''), button=el('button',offline?'결과 보기':'분석 실행');
 selector.setAttribute('aria-label','데이터 실행 기록'); limit.setAttribute('aria-label','분석 문서 수');
 for(const run of availableRuns){const option=el('option',`${run.source} · ${run.id.slice(0,8)}`);option.value=run.id;selector.append(option)}
 for(const n of [10,20,50,100]){const option=el('option',`${n}건`);option.value=n;limit.append(option)}
 limit.value='100';
 button.style.cssText='background:#28686d;color:white;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer';
 controls.append(selector,limit,button);$('meta').after(controls);
 if(offline){const note=el('div','오프라인 모드: 이미 실행한 결과를 탐색합니다. 버튼은 엔진을 다시 실행하지 않습니다.','sub');controls.after(note);}
 button.onclick=async()=>{button.disabled=true;button.textContent=offline?'불러오는 중…':'분석 중…';try{if(offline){const saved=snapshots[selector.value];result={...saved,rows:saved.rows.slice(0,Number(limit.value))};}else{const params=new URLSearchParams({run:selector.value,limit:limit.value});const response=await fetch('/api/analyze?'+params);if(!response.ok)throw Error(`HTTP ${response.status}`);result=await response.json();}$('query').value='';$('filter').value='all';show()}catch(e){$('meta').textContent='실행 실패: '+e.message;$('metrics').replaceChildren();$('results').replaceChildren();$('count').textContent=''}finally{button.disabled=false;button.textContent=offline?'결과 보기':'분석 실행'}};
 if(offline)button.click();
}
show();
</script></html>
